name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: backend (lint, types, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q -m "not integration and not network"

  integration:
    name: integration (fixture site, real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Start Postgres, Redis and the fixture site
        working-directory: .
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m integration
      - name: Show container logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f infra/docker-compose.yml logs --tail 50

  web:
    name: web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc --noEmit
      - run: bun run build

  image:
    name: image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # The audit needs a browser, so the image installs Chromium: this job proves that still works
      # rather than discovering it on the machine that hosts the demo.
      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          tags: sitewarrant-api:ci

  report:
    name: report (screenshot artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --frozen --group dev
      - name: Start Postgres, Redis and the fixture site
        working-directory: .
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      # Deterministic audit: no agents, no API key, the same page and the same cause every time.
      # Exit 1 means a blocker was proven, which the fixture has by design; only 2 is a failure.
      - name: Audit the fixture
        run: |
          set +e
          uv run sitewarrant audit http://localhost:8081/ --allow-private --out report.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi
          echo "audit exit $code (0 clean, 1 blocker proven — the fixture carries two)"
      # One step: a background process does not outlive the shell that started it, so serving and
      # capturing happen together. The web app is closed by default, so this run mints its own
      # operator and the capture signs in with it: the screenshot has to show the product, and the
      # gate is part of the product — it is not turned off for the artifact.
      - name: Serve the API and capture the report page
        run: |
          export SITEWARRANT_AUTH_LOGIN=screenshot
          export SITEWARRANT_AUTH_PASSWORD="$(openssl rand -hex 16)"
          export SITEWARRANT_AUTH_SECRET="$(openssl rand -hex 32)"
          (cd ../web && bun install --frozen-lockfile \
            && SITEWARRANT_API=http://127.0.0.1:8000 bun run build)
          # Each server gets its own process group, so stopping it stops what it spawned: a
          # surviving `uv run` keeps the cache lock ("Cache is currently in-use, waiting for
          # other uv processes to finish"), and the setup-uv post step then fails pruning the
          # cache five minutes after a capture that worked.
          setsid bash -c 'cd ../web && exec env SITEWARRANT_API=http://127.0.0.1:8000 bun run start -- -H 127.0.0.1 -p 3000' &
          web_pid=$!
          setsid uv run sitewarrant-api &
          api_pid=$!
          stop_servers() {
            status=$?
            set +e
            for pid in "$web_pid" "$api_pid"; do
              if kill -TERM -- "-$pid" 2>/dev/null; then
                echo "signalled process group $pid"
              elif ps -p "$pid" > /dev/null 2>&1; then
                echo "::warning::could not signal process group $pid"
              else
                echo "process group $pid had already stopped"
              fi
            done
            for pid in "$web_pid" "$api_pid"; do
              for _ in $(seq 1 10); do
                kill -0 -- "-$pid" 2>/dev/null || break
                sleep 0.5
              done
              if kill -0 -- "-$pid" 2>/dev/null; then
                echo "::warning::process group $pid ignored SIGTERM, sending SIGKILL"
                if ! kill -KILL -- "-$pid" 2>/dev/null; then
                  echo "::error::could not kill process group $pid"
                fi
              fi
              for _ in $(seq 1 10); do
                kill -0 -- "-$pid" 2>/dev/null || break
                sleep 0.5
              done
              if kill -0 -- "-$pid" 2>/dev/null; then
                # Waiting here risks the job timeout, and the capture already happened.
                echo "::error::process group $pid is still alive after SIGKILL"
                continue
              fi
              code=0
              wait "$pid" || code=$?
              case "$code" in
                0 | 137 | 143 | 127) ;;
                *) echo "::warning::process group $pid exited with $code during cleanup" ;;
              esac
            done
            exit "$status"
          }
          trap stop_servers EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null \
              && curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
          audit=$(python3 -c "import json;print(json.load(open('report.json'))['audit_id'])")
          uv run python ../scripts/report_screenshot.py \
            --url "http://127.0.0.1:3000/?audit=$audit" --out ../report-page.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-page
          path: report-page.png
          if-no-files-found: warn
      - name: Show container logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f infra/docker-compose.yml logs --tail 50
