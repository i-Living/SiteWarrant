server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Used by the SSRF redirect test: a public page that bounces to a link-local address.
    location = /to-private {
        return 302 http://169.254.169.254/latest/meta-data;
    }

    # The frozen benchmark corpus: eight labelled sites, served next to the fixture site.
    location /bench/ {
        alias /usr/share/nginx/benchmark/sites/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
