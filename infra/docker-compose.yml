name: sitewarrant

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sitewarrant
      POSTGRES_PASSWORD: sitewarrant
      POSTGRES_DB: sitewarrant
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitewarrant -d sitewarrant"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Static site with deliberately planted defects. Port 8080 is taken on the
  # development host, so this listens on 8081.
  fixtures:
    image: nginx:1.27-alpine
    volumes:
      - ../benchmark/fixtures/site:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 3s
      timeout: 3s
      retries: 20
